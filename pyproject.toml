[project]
name = "stt-benchmark-lab"
version = "0.1.0"
description = "Local-first, provenance-aware speech recognition research workbench"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "regex>=2024.11",
  "rapidfuzz>=3.12,<4",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "httpx2>=2,<3", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/coordinator/stt_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
