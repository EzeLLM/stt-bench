name: STTBenchmarkLab
options:
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
packages:
  STTNative:
    path: ../../runners/apple-native
targets:
  STTBenchmarkLab:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: STTNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sttbench.lab
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: STT Lab
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record speech locally for on-device transcription tests.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Pair with your Mac and transfer private benchmark inputs and results over your local network.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
    info:
      path: Generated/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
